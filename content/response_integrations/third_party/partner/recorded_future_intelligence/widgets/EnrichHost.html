<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css?family=Source Sans Pro" rel="stylesheet"/>
  <title>
   Recorded Future - Enrich Host
  </title>
  <style>
   /* 1. ROOT VARIABLES & THEMES */
    :root {
      /* Layout & Colors */
      --widget-bg: #212c44;
      --widget-font-family: 'Source Sans Pro', sans-serif;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #6275a3;

      /* Components */
      --widget-row-highlight-bg: #2f3d5c;
      --divider-border-colcor: #3a4a6c;
      --divider-border-width: 1px;

      /* Sidebar */
      --sidebar-width: 167px;
      --sidebar-item-active-bg: #3a4a6c;

      /* Table */
      --table-color-even-row: #26334f;

      /* Logo */
      --logo-size: 48px;
      --logo-color: #ffffff;

      /* UI Elements */
      --input-border: #6275a3;
      --dropdown-shadow: rgba(0, 0, 0, 0.6);
      --modal-overlay: rgba(0, 0, 0, 0.5);

      /* Status & Tags */
      --tag-bg: #6a7180;
      --status-text: #b5b5b5;
      --tooltip-bg: #ccccda;
      --tooltip-text: #161625;

      /* Severity Colors (Dark Theme Default) */
      --sev-unspec: #b2b6bd;
      --sev-low: #78d9ec;
      --sev-medium: #fff371;
      --sev-high: #fa903e;
      --sev-critical: #ec453b;

      /* Status Colors (Dark Theme Default) */
      --val-success: #99d7ca;
      --val-warning: #fff371;
      --val-error: #ff5a50;
    }

    html.light-theme {
      --widget-bg: #ffffff !important;
      --widget-text-color: #0f1029;
      --scrollbar-bg-color: #d3d8ea;
      --widget-row-highlight-bg: #e5e8f2;
      --divider-border-colcor: #d3d8ea;
      --sidebar-item-active-bg: #d3d8ea;
      --table-color-even-row: #f4f5fa;
      --logo-color: #4e4f63;
      --input-border: #d3d8ea;
      --tag-bg: #7a8294;
      --status-text: #6b6d7a;
      --tooltip-bg: #4e4f63;
      --tooltip-text: #ffffff;
      --dropdown-shadow: rgba(0, 0, 0, 0.1);
      --modal-overlay: rgba(0, 0, 0, 0.2);

      /* Severity Colors (Light) */
      --sev-unspec: #95a5a6;
      --sev-low: #0088a5; 
      --sev-medium: #d6a000; 
      --sev-high: #d35400; 
      --sev-critical: #c0392b; 

      /* Status Colors (Light) */
      --val-success: #27ae60;
      --val-warning: #d6a000;
      --val-error: #c0392b;
    }

    html.dark-theme {
      --widget-bg: #232330 !important;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #303045;
      --widget-row-highlight-bg: #5f6368;
      --divider-border-colcor: #303045;
      --sidebar-item-active-bg: #5f6368;
      --table-color-even-row: #3c4043;
      --logo-color: #ffffff;
      --input-border: #80808b;
      --tooltip-bg: #e8eaed;
      --tooltip-text: #131314;
    }

    /* 2. RESET & BASICS */
    * {
      margin: 0; padding: 0; outline: none; box-sizing: border-box;

      /* NATIVE SCROLLBAR STYLING */
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-bg-color) transparent;
    }

    /* WEBKIT SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 8px;  /* Matches "thin" */
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-bg-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    table { width: 100%; border-collapse: collapse; border-spacing: 0; }
    ol, ul { list-style: none; }
    button, input, textarea { font-family: inherit; background: transparent; border: 0; color: inherit; }
    button, a[href] { cursor: pointer; }

    /* 3. GLOBAL LAYOUT */
    body {
      font-family: var(--widget-font-family), serif;
      color: var(--widget-text-color);
      background-color: var(--widget-bg);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .wrapper {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .text-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .divider-border-style { border: 0; border-color: var(--divider-border-colcor); border-style: solid; }

    /* 4. LOGO */
    .logo {
      width: var(--logo-size) !important;
      height: var(--logo-size) !important;
      min-width: var(--logo-size) !important;
      max-width: var(--logo-size) !important;
      flex: 0 0 var(--logo-size) !important;
      color: var(--logo-color);
    }
    .wrapper > .logo { position: absolute; top: 3px; right: 20px; z-index: 10; }

    /* 5. HEADER & SIDEBAR */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; min-height: 50px; padding: 0 6px;
      border-bottom-width: var(--divider-border-width);
      border-bottom-style: solid;
      border-color: var(--divider-border-colcor);
      flex-shrink: 0;
      width: 100%;
    }
    .header-title { font: 600 16px/22px var(--widget-font-family); word-break: break-word; }

    .left-side {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      overflow-y: auto;
      padding-right: 6px;
      border-right-width: var(--divider-border-width);
    }
    .right-side { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* 6. CONTENT & LISTS */
    .main-content { flex: 1; overflow: auto; padding: 0 6px; }

    .list-item { display: flex; align-items: flex-start; gap: 6px; padding: 3px 6px; }
    .list-item:hover { background-color: var(--widget-row-highlight-bg); }
    .list-item-text { width: 50%; max-width: 300px; word-break: break-word; }
    .list-item-text-key { font: 600 14px/18px var(--widget-font-family); text-transform: uppercase; }
    .list-item-text-value { font: 400 14px/18px var(--widget-font-family); }

    .left-side-item {
      width: 100%; padding: 10px;
      font: 400 14px/18px var(--widget-font-family);
      display: flex; align-items: center; justify-content: space-between;
    }
    .left-side-item.active { background-color: var(--sidebar-item-active-bg); font-weight: 600; }
    .left-side-item-count { font-weight: 600; }

    .tag { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-item { color: #ffffff; padding: 2px 12px; background-color: var(--tag-bg); border-radius: 2px; font-size: 14px; }
    .list-item-screenshot { justify-content: center; cursor: pointer; border: 0; }
    @media screen and (min-width: 700px) { .list-item-text-value { max-width: 100%; width: 100%; } }

    /* 7. TABLE STYLES */
    .table {
      table-layout: fixed;
    }
    .table-wrapper { padding: 0 6px; margin-top: 8px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .table-container { overflow: auto; flex: 1; min-height: 0; }

    .table-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
    .table-title { font: 600 14px/18px var(--widget-font-family); text-transform: uppercase; }
    .table-row-count { display: flex; align-items: center; gap: 6px; margin-right: auto; font: 600 14px/18px var(--widget-font-family); }

    .table th {
      width: 250px;
      background-color: var(--widget-row-highlight-bg);
      padding: 6px 12px; text-align: left; position: sticky; top: 0; z-index: 5;
      font: 600 14px/18px var(--widget-font-family); text-transform: uppercase;
    }
    .table td { padding: 8px 12px; font-size: 14px; vertical-align: top; }
    .table tr:nth-child(even) { background-color: var(--table-color-even-row); }
    .table-resizable-line {
      position: absolute; inset: 3px 6px 3px auto; width: 2px;
      cursor: col-resize; background-color: var(--divider-border-colcor); z-index: 10;
    }
    .table-button { display: flex; align-items: center; gap: 6px; text-decoration: underline; }
    .table-button-icon { width: 20px; height: 20px; flex-shrink: 0; }

    /* 8. INPUTS & CONTROLS */
    .input {
      border: 1px solid var(--input-border); border-radius: 4px;
      padding: 4px 8px; color: var(--widget-text-color); font-size: 14px;
    }
    .input::placeholder { color: var(--widget-text-color); opacity: 0.7; }
    input[type="checkbox"] { max-width: 13px; max-height: 13px; margin: 0; }

    .table-events {
      display: flex; align-items: center; gap: 12px; justify-content: flex-end;
      margin-bottom: 12px; padding: 0 6px; flex-shrink: 0;
    }
    .table-udm-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }

    /* 9. DROPDOWN */
    .dropdown-container {
      width: 24px;
      height: 24px;
      margin-right: auto;
      position: relative;
    }

    .dropdown-button {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background-color: var(--widget-bg);
      min-width: 270px;
      max-width: 280px;
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 0 4px 6px 3px var(--dropdown-shadow);
      border-radius: 4px;
      flex-direction: column;
      display: none;
      border: 1px solid var(--divider-border-colcor);
    }

    .dropdown.show { display: flex; }
    .dropdown-events { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dropdown-search { width: 100%; }
    .dropdown-list { margin-top: 12px; max-height: 300px; overflow: auto; }
    .dropdown-list-label { display: flex; align-items: center; gap: 6px; width: 100%; cursor: pointer; padding: 6px 0; }
    .dropdown-list-select { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 14px; }

    /* 10. COUNTER & STATUS */
    .counter { display: flex; align-items: center; gap: 8px; justify-content: center; }
    .counter-number { font: 600 20px/24px var(--widget-font-family); }
    .counter-title { font: 600 16px/22px var(--widget-font-family); text-transform: uppercase; }

    .list-item-specific-value { display: flex; align-items: center; gap: 8px; }
    .list-item-success-value { color: var(--val-success); }
    .list-item-warning-value { color: var(--val-warning); }
    .list-item-error-value { color: var(--val-error); }
    .list-item-status-value { color: var(--status-text); }

    /* 11. TOOLTIPS */
    .tooltip {
      max-width: 100%; position: absolute; padding: 8px 16px;
      border-radius: 4px; background-color: var(--tooltip-bg);
      color: var(--tooltip-text); font: 400 14px/18px var(--widget-font-family);
      z-index: 999; word-wrap: break-word;
    }
    .tooltip-triangle {
      position: absolute; top: 100%;
      border-top: solid 8px var(--tooltip-bg);
      border-left: solid 8px transparent; border-right: solid 8px transparent;
    }

    /* 12. MODALS */
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background-color: var(--widget-bg); box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 16px; max-width: 90%; min-width: 50%; max-height: 90%;
      border-radius: 8px; z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid var(--divider-border-colcor);
    }
    .modal-overlay { position: fixed; inset: 0; background-color: var(--modal-overlay); z-index: 9998; }
    .modal-header { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .modal-title { font: 600 20px/26px var(--widget-font-family); word-wrap: break-word; flex: 1; }
    .modal-close { width: 24px; height: 24px; display: flex; align-items: center; justify-content: flex-end; }
    .modal-close svg { width: 20px; height: 20px; stroke: var(--widget-text-color); }
    .modal-content { overflow: auto; }
    .modal-content img { display: flex; max-width: 100%; max-height: 100%; margin: 0 auto; }
    .modal-content pre { font: 400 14px/18px var(--widget-font-family); white-space: pre-wrap; word-break: break-all; }

    /* 13. RECORDED FUTURE RISK SUMMARY */
    .rf-summary {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
      padding: 10px 6px; margin-bottom: 8px;
      border-bottom-width: var(--divider-border-width);
      border-bottom-style: solid;
      border-color: var(--divider-border-colcor);
    }

    /* The score badge is tinted by the criticality band via --rf-band. */
    .rf-score {
      display: flex; align-items: baseline; gap: 4px;
      padding: 2px 10px; border-radius: 4px;
      border: 2px solid var(--rf-band, var(--sev-unspec));
      color: var(--rf-band, var(--sev-unspec));
    }
    .rf-score-value { font: 700 22px/26px var(--widget-font-family); }
    .rf-score-max { font: 400 12px/16px var(--widget-font-family); opacity: 0.8; }

    .rf-band-label {
      font: 600 14px/18px var(--widget-font-family);
      text-transform: uppercase;
      color: var(--rf-band, var(--sev-unspec));
    }

    .rf-meta { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
    .rf-meta-row { display: flex; gap: 6px; font: 400 13px/17px var(--widget-font-family); }
    .rf-meta-key { font-weight: 600; text-transform: uppercase; }

    .rf-pill-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 4px;
      border: 1px solid var(--input-border);
      color: var(--widget-text-color); text-decoration: none;
      font: 600 13px/17px var(--widget-font-family); white-space: nowrap;
    }
    .rf-pill-link:hover { background-color: var(--widget-row-highlight-bg); }
    .rf-pill-link svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
 </head>
 <body>
  <div class="wrapper">
   <div class="left-side divider-border-style" id="leftSide">
   </div>
   <div class="right-side" id="rightSide">
    <div class="header divider-border-style">
     <h1 class="header-title" id="headerTitle">
     </h1>
     <svg class="logo" fill="currentColor" height="50" version="1.1" viewbox="0 0 50 50" width="50" xmlns="http://www.w3.org/2000/svg">
      <title>
       Recorded Future
      </title>
      <path d="M25.15,17.71h0.27c1.46,0,2.64-1.18,2.64-2.64V4.51c0-1.46-1.18-2.64-2.64-2.64h-0.27c-1.46,0-2.64,1.18-2.64,2.64v10.56 C22.51,16.53,23.7,17.71,25.15,17.71z M14.78,7.33c-1.53,0-2.77,1.24-2.77,2.77v29.28c0,1.53,1.24,2.77,2.77,2.77 s2.77-1.24,2.77-2.77V10.11C17.55,8.57,16.31,7.33,14.78,7.33z M4.19,21.35c-1.88,0-3.4,1.52-3.4,3.4s1.52,3.4,3.4,3.4 s3.4-1.52,3.4-3.4S6.07,21.35,4.19,21.35z M25.36,21.35c-1.88,0-3.4,1.52-3.4,3.4s1.52,3.4,3.4,3.4c1.88,0,3.4-1.52,3.4-3.4 S27.24,21.35,25.36,21.35z M46.6,21.35c-1.88,0-3.4,1.52-3.4,3.4s1.52,3.4,3.4,3.4s3.4-1.52,3.4-3.4S48.48,21.35,46.6,21.35z M25.42,31.78h-0.27c-1.46,0-2.64,1.18-2.64,2.64v10.56c0,1.46,1.18,2.64,2.64,2.64h0.27c1.46,0,2.64-1.18,2.64-2.64V34.42 C28.06,32.96,26.88,31.78,25.42,31.78z M35.98,7.33c-1.53,0-2.77,1.24-2.77,2.77v29.28c0,1.53,1.24,2.77,2.77,2.77 s2.77-1.24,2.77-2.77V10.11C38.75,8.57,37.51,7.33,35.98,7.33z">
      </path>
     </svg>
    </div>
    <section class="main-content" id="mainContent">
    </section>
   </div>
  </div>
  <script>
   /**
   * Constants for theme settings.
   */
  const ThemeSettings = {
    LIGHT_THEME_CLASS: 'light-theme',
    DARK_THEME_CLASS: 'dark-theme',
  };

  const LIGHT_THEME_HEX = "#bdc1c6";
  const DARK_THEME_HEX = "#282837";
  const GRAY_THEME_HEX = "#2f3d5c";

  /**
   * The main 'message' event handler that updates the theme.
   */
  function handleThemeUpdate(event) {
    if (event.source !== window.parent) {
      return;
    }

    const styles = event.data;

    if (typeof styles !== 'object' || styles === null) {
      return;
    }

    const bg = styles.background || styles.backgroundColor || '';
    const colorString = bg.toLowerCase().trim();

    let isLight = false;
    let isDark = false;
    let isGray = false;

    if (colorString === LIGHT_THEME_HEX) {
      isLight = true;
    } else if (colorString === DARK_THEME_HEX) {
      isDark = true;
    } else if (colorString === GRAY_THEME_HEX) {
      isGray = true;
    } else {
      let r, g, b;
      const rgbMatch = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);

      if (rgbMatch) {
        r = parseInt(rgbMatch[1]);
        g = parseInt(rgbMatch[2]);
        b = parseInt(rgbMatch[3]);
      } else if (bg.startsWith('#')) {
        const hex = bg.replace('#', '');
        const fH = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
        if (fH.length === 6) {
          r = parseInt(fH.substring(0, 2), 16);
          g = parseInt(fH.substring(2, 4), 16);
          b = parseInt(fH.substring(4, 6), 16);
        }
      }

      if (r !== undefined) {
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        if (brightness > 128) {
          isLight = true;
        }
      }
    }

    const html = document.documentElement;
    const body = document.body;

    if (isLight) {
      html.classList.add(ThemeSettings.LIGHT_THEME_CLASS);
      html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
    } else if (isDark) {
      html.classList.add(ThemeSettings.DARK_THEME_CLASS);
      html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS);
    } else {
      html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS);
      html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
    }
  }

  window.addEventListener('message', handleThemeUpdate);


  const actionListData = [{stepInstanceName}.JsonResult];

  // Top level `EntityResult` keys kept for the generic detail list, in display
  // order. `risk`, `timestamps` and `intelCard` are deliberately absent: they
  // feed the summary block instead. Every name here must exist in
  // resources/EnrichHost_JsonResult_example.json -- a typo would render an empty
  // widget with no error anywhere, so the data-contract test enforces it.
  const allowlistedFields = ["entity"];

  // Criticality bands, indexed by Recorded Future's 0-4 criticality scale, which
  // is shared by every entity type. The labels here are only a fallback for a
  // payload missing `risk.criticalityLabel`; the API's own label is always
  // preferred, because the vocabulary is entity-type specific -- vulnerabilities
  // report Low/Medium/High/Critical where IOCs report
  // Unusual/Suspicious/Malicious/Very Malicious over the same numeric scale.
  //
  // Declared here rather than beside the other summary helpers below because the
  // data-prep code that follows runs at load time and would hit the temporal
  // dead zone of a `const` declared later in the script.
  const CRITICALITY_BANDS = [
    {label: "No Malicious Content", color: "var(--sev-unspec)"},
    {label: "Unusual", color: "var(--sev-low)"},
    {label: "Suspicious", color: "var(--sev-medium)"},
    {label: "Malicious", color: "var(--sev-high)"},
    {label: "Very Malicious", color: "var(--sev-critical)"},
  ];

  // Constants for tooltip positioning
  const tooltipGap = 25;
  const tooltipTriangleHeight = 8;
  const tooltipTriangleMinGap = 5;
  const triangleWidth = 16;
  let tooltipTimeout = undefined;

  // Get all elements "table"
  const tables = document.getElementsByClassName("table");

  const tooltipDetectResizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const target = entry.target;
      if (target) {
        const {offsetWidth, scrollWidth} = target;
        if (scrollWidth > offsetWidth) {
          target.addEventListener("mouseover", createTooltipListener);
          target.addEventListener("mouseout", removeTooltipListener);
        } else {
          target.removeEventListener("mouseover", createTooltipListener);
          target.removeEventListener("mouseout", removeTooltipListener);
        }
      }
    }
  });

  // Build the display model for every enriched entity. `EntityResult` is
  // normalized first, then split into the summary block and the detail model.
  const filteredActionListData = actionListData
    .filter(el => el && typeof el.Entity === "string" && el.Entity.trim() !== "")
    .map(el => {
      const model = buildDisplayModel(el.EntityResult);
      return {...el, EntityResult: model.details, Summary: model.summary};
    })
    .filter(el => Object.keys(el.EntityResult).length > 0 || el.Summary.hasRisk);

  // Update the UI with filtered data
  if (filteredActionListData.length > 0) {
    renderRecordedFutureSummary(filteredActionListData[0].Summary);
    renderKeysInUI(flattenKeys(filteredActionListData[0].EntityResult));

    headerTitle.textContent = filteredActionListData[0].Entity;

    filteredActionListData.forEach((el, index) => {
      const displayValue = el.Entity;
      const cleanDisplayValue = removeSpecialSymbols(displayValue);
      const button = document.createElement("button");
      button.id = cleanDisplayValue;
      button.classList.add("left-side-item");
      button.setAttribute("data-menu", "item");
      if (index === 0) {
        button.classList.add("active");
      }
      renderWithTooltip(button, displayValue);
      leftSide.append(button);
    });


    if (filteredActionListData.length === 1) {
      leftSide.remove();
      rightSide.style.width = "100%";
    } else {
      leftSide.addEventListener("click", event => {
        const target = event.target.closest("[data-menu='item']");
        if (!target) return;

        const id = target.id;
        const object = filteredActionListData.find(el => removeSpecialSymbols(el.Entity) === id);

        if (object) {
          mainContent.innerHTML = "";
          renderRecordedFutureSummary(object.Summary);
          renderKeysInUI(flattenKeys(object.EntityResult));
          headerTitle.textContent = object.Entity;
          renderModal();
          for (let i = 0; i < tables.length; i++) {
            resizableGrid(tables[i]);
          }
        }
        document.querySelectorAll("[data-menu='item']").forEach(item => item.classList.remove("active"));
        target.classList.add("active");

        mainContent.scrollTop = 0;
      });
    }

    renderModal();
  }

  /**
   * Derives a criticality band from the risk score, for a payload that carries a
   * score but no criticality. Thresholds match the bands documented on the
   * action's "Risk Score Threshold" parameter.
   */
  function bandFromScore(score) {
    if (score >= 90) return 4;
    if (score >= 65) return 3;
    if (score >= 25) return 2;
    if (score >= 5) return 1;
    return 0;
  }

  /**
   * Unwraps Recorded Future's `EntityResult`.
   *
   * The API report arrives as a single element list because
   * `RFIndicator.to_json()` wraps it in a one-tuple. The template's renderer
   * expects a plain object: left as a list, every key would render prefixed with
   * its array index ("0 Risk Score") and the field allowlist would match
   * nothing. A plain object is passed through untouched, so this keeps working
   * if the action's contract is ever changed.
   */
  function normalizeEntityResult(entityResult) {
    const candidate = Array.isArray(entityResult) ? entityResult[0] : entityResult;
    return candidate !== null && typeof candidate === "object" && !Array.isArray(candidate)
      ? candidate
      : {};
  }

  /**
   * Formats a Recorded Future ISO 8601 timestamp as "YYYY-MM-DD HH:MM UTC".
   *
   * Fixed to UTC rather than the viewer's locale so that two analysts reading
   * the same case see the same string, and so the output is testable.
   */
  function formatTimestamp(value) {
    if (typeof value !== "string" || value === "") {
      return "";
    }
    const parsed = new Date(value);
    if (Number.isNaN(parsed.getTime())) {
      return value;
    }
    return `${parsed.toISOString().slice(0, 10)} ${parsed.toISOString().slice(11, 16)} UTC`;
  }

  /**
   * Returns the URL only when it is safe to place in an href, guarding against a
   * `javascript:` payload reaching the DOM -- this widget renders with
   * `safe_rendering: false`.
   */
  function safeHttpUrl(value) {
    if (typeof value !== "string") {
      return "";
    }
    return /^https?:\/\//i.test(value.trim()) ? value.trim() : "";
  }

  /**
   * Splits a Recorded Future report into the headline summary and the object the
   * template's generic renderer consumes.
   */
  function buildDisplayModel(entityResult) {
    const report = normalizeEntityResult(entityResult);
    const risk = report.risk !== null && typeof report.risk === "object" ? report.risk : {};
    const timestamps =
      report.timestamps !== null && typeof report.timestamps === "object" ? report.timestamps : {};

    const details = filterKeys(report, allowlistedFields);

    // The triggered risk rules are the most actionable part of the payload. Lift
    // them out of `risk` so they render as their own table, and rename the
    // columns from the API's `*String` names to analyst-facing ones.
    if (Array.isArray(risk.evidenceDetails) && risk.evidenceDetails.length > 0) {
      details.riskRules = risk.evidenceDetails.map(rule => ({
        rule: rule.rule,
        criticality: rule.criticalityLabel,
        evidence: rule.evidenceString,
        mitigation: rule.mitigationString,
        timestamp: formatTimestamp(rule.timestamp),
      }));
    }

    // Lift each link category to a top level key, so its table is titled with
    // the category ("Actors, Tools & TTPs Table") rather than nested under
    // "Links". Empty categories are dropped. Populated only when the action ran
    // with "Include Links" enabled.
    const links = report.links !== null && typeof report.links === "object" ? report.links : {};
    Object.entries(links).forEach(([category, entries]) => {
      if (Array.isArray(entries) && entries.length > 0) {
        details[category] = entries;
      }
    });

    const hasScore = typeof risk.score === "number";
    const bandIndex = typeof risk.criticality === "number"
      ? risk.criticality
      : (hasScore ? bandFromScore(risk.score) : -1);
    const band = CRITICALITY_BANDS[bandIndex];

    return {
      details,
      summary: {
        hasRisk: hasScore,
        score: hasScore ? risk.score : null,
        bandColor: band ? band.color : "var(--sev-unspec)",
        bandLabel: risk.criticalityLabel || (band ? band.label : ""),
        riskString: typeof risk.riskString === "string" ? risk.riskString : "",
        riskSummary: typeof risk.riskSummary === "string" ? risk.riskSummary : "",
        firstSeen: formatTimestamp(timestamps.firstSeen),
        lastSeen: formatTimestamp(timestamps.lastSeen),
        intelCard: safeHttpUrl(report.intelCard),
      },
    };
  }

  /**
   * Renders the Recorded Future summary block above the generic detail list:
   * risk score in its criticality band colour, how many risk rules fired, the
   * observation window, and a link out to the Intelligence Card.
   */
  function renderRecordedFutureSummary(summary) {
    if (!summary || (!summary.hasRisk && !summary.intelCard)) {
      return;
    }

    const container = document.createElement("div");
    container.classList.add("rf-summary");

    if (summary.hasRisk) {
      const badge = document.createElement("div");
      badge.classList.add("rf-score");
      badge.style.setProperty("--rf-band", summary.bandColor);

      const scoreValue = document.createElement("span");
      scoreValue.classList.add("rf-score-value");
      scoreValue.textContent = String(summary.score);
      const scoreMax = document.createElement("span");
      scoreMax.classList.add("rf-score-max");
      scoreMax.textContent = "/ 99";
      badge.append(scoreValue, scoreMax);
      container.append(badge);

      if (summary.bandLabel) {
        const bandLabel = document.createElement("span");
        bandLabel.classList.add("rf-band-label");
        bandLabel.style.setProperty("--rf-band", summary.bandColor);
        renderWithTooltip(bandLabel, summary.bandLabel);
        container.append(bandLabel);
      }
    }

    const meta = document.createElement("div");
    meta.classList.add("rf-meta");

    // `riskSummary` reads "12 of 79 Risk Rules currently observed." and already
    // says everything `riskString` ("12/79") does, so prefer it when present.
    const metaRows = [
      ["Risk Rules", summary.riskSummary || summary.riskString],
      ["First Seen", summary.firstSeen],
      ["Last Seen", summary.lastSeen],
    ];
    metaRows.forEach(([key, value]) => {
      if (!value) {
        return;
      }
      const row = document.createElement("div");
      row.classList.add("rf-meta-row");
      const rowKey = document.createElement("span");
      rowKey.classList.add("rf-meta-key");
      rowKey.textContent = `${key}:`;
      const rowValue = document.createElement("span");
      rowValue.textContent = value;
      row.append(rowKey, rowValue);
      meta.append(row);
    });
    container.append(meta);

    if (summary.intelCard) {
      const link = document.createElement("a");
      link.classList.add("rf-pill-link");
      link.href = summary.intelCard;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const linkText = document.createElement("span");
      linkText.textContent = "Intelligence Card";
      link.append(linkText);
      container.append(link);
    }

    document.getElementById("mainContent").append(container);
  }

  /**
   * Recursively flattens a nested object into an array of { key, value } pairs.
   */
  function flattenKeys(obj, parentKey = "", sep = " ") {
    let keys = [];
    for (let key in obj) {
      if (obj.hasOwnProperty(key)) {
        let combinedKey = parentKey ? `${parentKey}${sep}${key}` : key;

        if (Array.isArray(obj[key])) {
          keys.push({key: combinedKey, value: obj[key]});
        } else if (typeof obj[key] === "object" && obj[key] !== null) {
          let nestedKeys = flattenKeys(obj[key], combinedKey, sep);
          keys = [...keys, ...nestedKeys];
        } else {
          keys.push({key: combinedKey, value: obj[key]});
        }
      }
    }

    return keys;
  }

  /**
   * Returns transposed Array
   */
  function transposeArray(array) {
    const n = array.length;
    if (n === 0) {
      return [];
    }
    const m = array[0]?.length ?? 0;
    if (m === 0) {
      return [];
    }

    let transposedArray = new Array(m);
    for (let i = 0; i < m; i++) {
      transposedArray[i] = new Array(n);
    }

    for (let i = 0; i < n; i++) {
      for (let j = 0; j < m; j++) {
        transposedArray[j][i] = array[i][j];
      }
    }

    return transposedArray;
  }

              button.setAttribute("data-modal-button", "item");
              if (Array.isArray(subValue) && subValue.length === 0 || subValue === null) {
                td.innerHTML = "N/A";
              } else {
                td.appendChild(button);
                button.setAttribute("data-modal-title", convertCamelCaseToTitleCase(key));
              }
            } else {
              if (subValue !== "") {
                renderWithTooltip(td, subValue);
              } else {
                td.textContent = "N/A";
              }
            }
            bodyRow.appendChild(td);
          });
          thead.appendChild(headerRow);
          tbody.appendChild(bodyRow);
        });

        // Add search functionality
        tableSearchInput.addEventListener("input", () => {
          const searchValue = tableSearchInput.value;
          let regex;

          try {
            regex = new RegExp(searchValue, 'i');
          } catch (e) {
            regex = null;
          }

          const rows = tbody.querySelectorAll("tr");

          rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            const match = Array.from(cells).some(cell => {
              const textContent = cell.textContent.toLowerCase();
              return regex ? regex.test(textContent) : textContent.includes(searchValue.toLowerCase());
            });
            row.style.display = match ? "" : "none";
          });

          updateRowCount();
        });

        updateRowCount();

        table.appendChild(thead);
        table.appendChild(tbody);
        tableHeader.appendChild(tableTitle);
        tableHeader.appendChild(rowCountContainer);
        tableHeader.appendChild(tableSearchInput);
        tableWrapper.appendChild(tableHeader);
        tableWrapper.appendChild(tableContainer);
        mainContent.appendChild(tableWrapper);
      }
    });
  }

  /**
   * Utility function to filter keys based on allowlistedFields
   */
  function filterKeys(obj, allowedKeys) {
    if (allowedKeys.length === 0) {
      return obj;
    }
    const filtered = {};
    allowedKeys.forEach(key => {
      if (obj.hasOwnProperty(key)) {
        filtered[key] = obj[key];
      }
    });
    return filtered;
  }

  /**
   * Formats data object into a human-readable string representation.
   */
  function formatData(data) {
    const isObject = obj => obj && obj.constructor === ({}).constructor;
    const formatIfObject = item => isObject(item) ? JSON.stringify(item, null, 4) : item;
    if (Array.isArray(data)) {
      return data.map(
        item => Array.isArray(item) ? formatData(item) : formatIfObject(item),
      ).join(",\n");
    }
    return formatIfObject(data);
  }

  /**
   * Removes special symbols from a string.
   */
  function removeSpecialSymbols(str) {
    return str.replace(/[^\w\s]/gi, "");
  }

  /**
   * Converts camelCaseName to Title Case.
   */
  function convertCamelCaseToTitleCase(str) {
    let result = str.replace(/_/g, " ");
    result = result.replace(/([a-z])([A-Z])/g, "$1 $2");
    result = result.replace(/\b\w/g, char => char.toUpperCase());
    return result;
  }

  /**
   * Creates a modal dialog with given content.
   */
  function createModal(content, title, isImage) {
    const modal = document.createElement("div");
    modal.classList.add("modal");
    const modalOverlay = document.createElement("div");
    modalOverlay.classList.add("modal-overlay");
    document.body.append(modalOverlay);
    const modalHeader = document.createElement("div");
    modalHeader.classList.add("modal-header");
    const modalTitle = document.createElement("h2");
    modalTitle.classList.add("modal-title");
    modalTitle.textContent = title;
    const closeButton = document.createElement("button");
    closeButton.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12" />
        </svg>`;
    closeButton.classList.add("modal-close");
    modalHeader.append(modalTitle);
    modalHeader.append(closeButton);
    modal.append(modalHeader);
    const modalContent = document.createElement("div");
    modalContent.classList.add("modal-content");
    modal.append(modalContent);

    if (isImage) {
      const imgElement = document.createElement("img");
      imgElement.src = content;

      checkImageUrl(content, function (isValid) {
        if (isValid) {
          imgElement.src = content;
        } else {
          modalContent.innerText = "Image URL is broken";
        }
      });
      modalContent.append(imgElement);
    } else {
      const preElement = document.createElement("pre");
      preElement.textContent = content;
      modalContent.append(preElement);
    }
    document.body.append(modal);
    closeButton.addEventListener("click", () => {
      modal.remove();
      modalOverlay.remove();
    });
  }


  /**
   * Attaches modal creation behavior to elements with data-modal-button attribute.
   */
  function renderModal() {
    document.querySelectorAll("[data-modal-button=\"item\"]").forEach((button) => {
      button.addEventListener("click", () => {
        const content = button.getAttribute("data-modal");
        const title = button.getAttribute("data-modal-title");
        const isImage = button.getAttribute("data-modal-img") === "true";
        createModal(content, title, isImage);
      });
    });
  }

  /**
   * Creates a tooltip with given text and position.
   */
  function createTooltip(text, x, y, trianglePointX, placeAtBottom, contentOverflowWindow) {
    removeTooltip();
    const tooltip = document.createElement("div");
    tooltip.classList.add("tooltip");
    tooltip.textContent = text;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
    if (contentOverflowWindow) {
      tooltip.style.right = `${tooltipGap}px`;
    }
    const tooltipTriangle = document.createElement("span");
    tooltipTriangle.classList.add("tooltip-triangle");
    tooltipTriangle.style.left = `${trianglePointX}px`;
    if (placeAtBottom) {
      tooltipTriangle.style.top = "-8px";
      tooltipTriangle.style.borderTop = "0";
      tooltipTriangle.style.borderBottom = "solid 8px var(--tooltip-bg)";
    }
    tooltip.append(tooltipTriangle);
    document.body.append(tooltip);
  }

  /**
   * Removes any existing tooltip from the DOM.
   */
  function removeTooltip() {
    const tooltip = document.querySelectorAll(".tooltip");
    tooltip.forEach((item) => {
      if (item) {
        item.remove();
      }
    });
  }

  /**
   * Sets a timeout to calculate and show tooltip position after a delay.
   */
  function createTooltipListener(event) {
    tooltipTimeout = setTimeout(() => calculateTooltipPosition(event), 1000);
  }

  /**
   * Clears any existing tooltip timeout and removes the tooltip.
   */
  function removeTooltipListener() {
    if (tooltipTimeout) {
      clearTimeout(tooltipTimeout);
    }
    removeTooltip();
  }

  /**
   * Calculates and positions the tooltip relative to the event target.
   */
  function calculateTooltipPosition(event) {
    const target = event.target;
    if (!target) {
      return;
    }
    const viewportWidth = window.innerWidth;
    const rect = target.getBoundingClientRect();
    const tooltipContent = document.createElement("div");
    tooltipContent.classList.add("tooltip");
    tooltipContent.style.top = "0";
    tooltipContent.textContent = target.textContent;
    document.body.appendChild(tooltipContent);
    let contentOverflowWindow = false;
    // Determine if window width would not be enough for content of tooltip
    if (tooltipGap * 2 + tooltipContent.offsetWidth >= viewportWidth) {
      // setting left, right positions to get correct tooltipContentWidth and tooltipContentHeight
      tooltipContent.style.left = `${tooltipGap}px`;
      tooltipContent.style.right = `${tooltipGap}px`;
      contentOverflowWindow = true;
    }
    const tooltipContentWidth = tooltipContent.offsetWidth;
    const tooltipContentHeight = tooltipContent.offsetHeight;
    tooltipContent.remove();
    const elementMidX = rect.left + (rect.width / 2);
    const placeOnRight = elementMidX + tooltipContentWidth / 2 + tooltipGap > viewportWidth;
    const x = Math.max(tooltipGap, placeOnRight ? viewportWidth - tooltipContentWidth - tooltipGap : elementMidX - tooltipContentWidth / 2);
    const placeAtBottom = rect.top < tooltipContentHeight;
    const y = placeAtBottom ? rect.bottom + tooltipTriangleHeight : rect.top - tooltipContentHeight;
    // Calculating trianglePointX relative to window width, to guarantee that it is not out of window
    const trianglePointX = Math.min(Math.max(elementMidX - x, tooltipTriangleMinGap), tooltipContentWidth - tooltipTriangleMinGap - triangleWidth);
    createTooltip(target.textContent, x, y, trianglePointX, placeAtBottom, contentOverflowWindow);
  }

  /**
   * Renders an item with text and sets up tooltip behavior.
   */
  function renderWithTooltip(item, text) {
    item.innerText = text;
    item.classList.add("text-ellipsis");
    tooltipDetectResizeObserver.observe(item);
  }

  function checkImageUrl(url, callback) {
    const img = new Image();
    img.onload = function () {
      callback(true);
    };
    img.onerror = function () {
      callback(false);
    };
    img.src = url;
  }

  /**
   * Function to make a table resizable
   */
  function resizableGrid(table) {
    const row = table.getElementsByTagName("tr")[0],
      cols = row ? row.children : undefined;
    if (!cols) return;

    for (let i = 0; i < cols.length; i++) {
      const div = createDiv();
      cols[i].appendChild(div);
      cols[i].style.position = "relative";
      setListeners(div);
    }

    function setListeners(div) {
      let pageX, curCol, nxtCol, curColWidth, nxtColWidth, tableWidth;

      div.addEventListener("mousedown", function (e) {
        curCol = e.target.parentElement;
        nxtCol = curCol.nextElementSibling;
        pageX = e.pageX;

        const padding = paddingDiff(curCol);

        curColWidth = curCol.offsetWidth - padding;
        if (nxtCol) {
          nxtColWidth = nxtCol.offsetWidth - padding;
        }
      });

      document.addEventListener("mousemove", function (e) {
        if (curCol) {
          const diffX = e.pageX - pageX;
          if (nxtCol) {
            nxtCol.style.width = nxtColWidth - diffX + "px";
          }
          curCol.style.width = curColWidth + diffX + "px";
          table.style.width = tableWidth + diffX + "px";
          removeTooltipListener();
        }
      });

      document.addEventListener("mouseup", function () {
        curCol = undefined;
        nxtCol = undefined;
        pageX = undefined;
        nxtColWidth = undefined;
        curColWidth = undefined;
        tableWidth = undefined;
      });
    }

    function createDiv() {
      const div = document.createElement("div");
      div.classList.add("table-resizable-line");
      return div;
    }

    function paddingDiff(col) {
      if (getStyleVal(col, "box-sizing") === "border-box") {
        return 0;
      }

      const padLeft = getStyleVal(col, "padding-left");
      const padRight = getStyleVal(col, "padding-right");
      return parseInt(padLeft) + parseInt(padRight);
    }

    function getStyleVal(elm, css) {
      return window.getComputedStyle(elm, null).getPropertyValue(css);
    }
  }

  for (let i = 0; i < tables.length; i++) {
    resizableGrid(tables[i]);
  }

  /**
   * Counts the number of rows in each table's body.
   */
  function countTableBodyRows() {
    const tables = document.getElementsByClassName("table");

    const rowCounts = [];

    for (let i = 0; i < tables.length; i++) {
      const table = tables[i];
      const tbody = table.querySelector("tbody");

      if (tbody) {
        const rows = tbody.getElementsByTagName("tr");
        rowCounts.push(rows.length);
      } else {
        rowCounts.push(0);
      }
    }

    return rowCounts;
  }

  countTableBodyRows();
  </script>
